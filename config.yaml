# Configuration file for Legal MT experiments
# Edit this file to change hyperparameters

data:
  corpus_path: "fileours.xlsx"
  output_dir: "data/splits"
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  random_seed: 42

training:
  # Common hyperparameters
  num_epochs: 10
  batch_size: 8
  gradient_accumulation_steps: 4
  learning_rate: 3.0e-5
  warmup_steps: 500
  max_length: 128
  weight_decay: 0.01

  # Training strategy
  fp16: true
  save_steps: 500
  eval_steps: 500
  logging_steps: 100
  save_total_limit: 3
  early_stopping_patience: 3

  # Optimization
  optimizer: "adamw"
  scheduler: "linear"
  max_grad_norm: 1.0

models:
  mbart:
    name: "facebook/mbart-large-50-many-to-many-mmt"
    src_lang_ne: "ne_NP"
    tgt_lang_en: "en_XX"

  nllb:
    name: "facebook/nllb-200-distilled-600M"
    # Alternative: facebook/nllb-200-1.3B or facebook/nllb-200-3.3B
    src_lang_ne: "npi_Deva"
    tgt_lang_en: "eng_Latn"

evaluation:
  # Evaluation settings
  num_beams: 5
  batch_size: 16
  max_length: 128

  # Metrics to compute
  metrics:
    - bleu
    - chrf++
    - length_ratio
    - ter  # Translation Error Rate (optional)

error_analysis:
  # Legal-specific analysis
  analyze_terminology: true
  analyze_modality: true
  analyze_clause_structure: true
  analyze_length: true

  # Number of error examples to extract
  num_examples: 10

visualization:
  # Plot settings
  figure_dpi: 300
  figure_format: "png"
  style: "seaborn"

  # Plots to generate
  plots:
    - model_comparison
    - directional_asymmetry
    - error_analysis
    - length_distribution
    - training_curves

output:
  # Output directories
  models_dir: "models"
  results_dir: "results"
  viz_dir: "results/visualizations"
  metrics_dir: "results/metrics"
  error_dir: "results/error_analysis"

# Experiment configurations to run
experiments:
  - model: "mbart"
    direction: "ne_en"
    description: "mBART-50 Nepali to English"

  - model: "mbart"
    direction: "en_ne"
    description: "mBART-50 English to Nepali"

  - model: "mbart"
    direction: "bidirectional"
    description: "mBART-50 Bi-directional"

  - model: "nllb"
    direction: "ne_en"
    description: "NLLB-200 Nepali to English"

  - model: "nllb"
    direction: "en_ne"
    description: "NLLB-200 English to Nepali"

  - model: "nllb"
    direction: "bidirectional"
    description: "NLLB-200 Bi-directional"
